<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recife Flats Temporada | Aluguel em Boa Viagem e Pina</title>
  <meta name="description" content="Apartamentos mobiliados para temporada em Boa Viagem e Pina, Recife. Fotos reais, reserva direta no WhatsApp — sem surpresa na chegada." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,ital@9..144,300..700,0..1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/utilities.css" />
  <link rel="stylesheet" href="./styles/components/button.css" />
  <link rel="stylesheet" href="./styles/components/announcement.css" />
  <link rel="stylesheet" href="./styles/components/navbar.css" />
  <link rel="stylesheet" href="./styles/components/menu-overlay.css" />
  <link rel="stylesheet" href="./styles/components/hero.css" />
  <link rel="stylesheet" href="./styles/components/booking-search.css" />
  <link rel="stylesheet" href="./styles/components/apartment-card.css" />
  <link rel="stylesheet" href="./styles/components/footer.css" />
  <link rel="stylesheet" href="./styles/components/floating-whatsapp.css" />
  <link rel="stylesheet" href="./styles/components/beach-decor.css" />
  <link rel="stylesheet" href="./styles/pages/home.css" />
</head>
<body>
  <rf-menu wraps=".site-content"></rf-menu>

  <div class="site-chrome site-chrome--fixed">
    <rf-announcement>Reserve direto — atendimento rápido pelo WhatsApp</rf-announcement>
    <rf-navbar over-hero hero-target="#hero"></rf-navbar>
  </div>

  <div class="site-content site-content--home-full">
    <rf-hero
      hero-id="home"
      api-base=""
      video-day="./assets/videos/video.mp4"
      video-night="./assets/videos/video.mp4"
      poster-day="./assets/images/boa_viagem-01.avif.png"
      poster-night="./assets/images/boa_viagem-01.avif.png"
      timezone="America/Recife"
      day-start="6"
      night-start="18"
      eyebrow="Recife Flats Temporada · Boa Viagem e Pina"
      title='Um lugar de <em>verdade</em> pra ficar em Recife.'
      description="Apartamentos mobiliados, prontos pra usar, com fotos reais e reserva direta — sem surpresa na chegada."
    ></rf-hero>

    <rf-home-marquee></rf-home-marquee>
    <rf-trust-strip></rf-trust-strip>
    <rf-apartments-teaser></rf-apartments-teaser>
    <rf-matching-teaser></rf-matching-teaser>
    <rf-reservation-steps></rf-reservation-steps>
    <rf-amenities-section></rf-amenities-section>
    <rf-why-choose-section></rf-why-choose-section>
    <rf-location-section></rf-location-section>
    <rf-testimonials-section></rf-testimonials-section>
    <rf-faq-section></rf-faq-section>
    <rf-booking-promo></rf-booking-promo>
    <rf-footer></rf-footer>
  </div>

  <rf-floating-whatsapp></rf-floating-whatsapp>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
